{{- if .Values.photo_backfill.enabled }}
---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "photo-backfill-config"
  labels:
    app.kubernetes.io/name: "impact-kids-app"
    app.kubernetes.io/component: "photo-backfill"
    app.kubernetes.io/instance: "{{.Release.Name}}"
data:
  OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
  OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
  OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
  Photos__ServiceUrl: "http://s3-service:{{ .Values.parameters.s3.port_s3 }}"
  Photos__BucketName: "{{ .Values.config.s3.bucket }}"
  Photos__BlockedMediaConsent: "{{ .Values.config.photos.blocked_media_consent }}"
{{- end }}
