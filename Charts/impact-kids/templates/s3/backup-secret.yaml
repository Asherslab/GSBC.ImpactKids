{{- if .Values.backup.s3.enabled }}
---
# Credentials for the hourly offsite copy. Two ends:
#   the SeaweedFS "backup" identity from s3-identities-secret, which is read-only on the bucket
#   a Backblaze B2 application key, which is created outside this repo
#
# The B2 bucket and keys are an out-of-repo prerequisite. Nothing here guesses them - `backup.s3` is
# disabled by default and every value is `required`, so a half-configured install fails at `helm
# upgrade` rather than running an hourly job that silently copies nothing.
apiVersion: "v1"
kind: "Secret"
type: "Opaque"
metadata:
  name: "s3-backup-secret"
  labels:
    app.kubernetes.io/name: "impact-kids-app"
    app.kubernetes.io/component: "s3-backup"
    app.kubernetes.io/instance: "{{.Release.Name}}"
stringData:
  # rclone reads its whole remote definition from RCLONE_CONFIG_<REMOTE>_<OPTION>, so there is no
  # rclone.conf to mount. Non-secret options are set on the CronJob; only these are secret.
  RCLONE_CONFIG_SEAWEED_ACCESS_KEY_ID: {{ required "secrets.s3.backupAccessKey is required when backup.s3.enabled - see values.yaml" .Values.secrets.s3.backupAccessKey | quote }}
  RCLONE_CONFIG_SEAWEED_SECRET_ACCESS_KEY: {{ required "secrets.s3.backupSecretKey is required when backup.s3.enabled - see values.yaml" .Values.secrets.s3.backupSecretKey | quote }}
  RCLONE_CONFIG_B2_ACCESS_KEY_ID: {{ required "backup.s3.accessKey is required when backup.s3.enabled - ask Asher for the Backblaze application key" .Values.backup.s3.accessKey | quote }}
  RCLONE_CONFIG_B2_SECRET_ACCESS_KEY: {{ required "backup.s3.secretKey is required when backup.s3.enabled - ask Asher for the Backblaze application key" .Values.backup.s3.secretKey | quote }}
{{- end }}
