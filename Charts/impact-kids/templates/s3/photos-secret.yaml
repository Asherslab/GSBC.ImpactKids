---
# The gRPC service's and the backfill job's S3 credentials, in the shape .NET configuration reads
# them (Photos:AccessKey / Photos:SecretKey).
#
# Separate from s3-identities-secret, which is the same two credentials in SeaweedFS' own
# -s3.config format. Two representations of one pair of secrets is not ideal, but the alternative -
# having the app parse the identities JSON - would couple the client to the server's config format
# for no gain. They are rendered from the same values, so they cannot drift.
apiVersion: "v1"
kind: "Secret"
type: "Opaque"
metadata:
  name: "photos-secret"
  labels:
    app.kubernetes.io/name: "impact-kids-app"
    app.kubernetes.io/component: "s3"
    app.kubernetes.io/instance: "{{.Release.Name}}"
stringData:
  Photos__AccessKey: {{ required "secrets.s3.accessKey is required - see values.yaml" .Values.secrets.s3.accessKey | quote }}
  Photos__SecretKey: {{ required "secrets.s3.secretKey is required - see values.yaml" .Values.secrets.s3.secretKey | quote }}
