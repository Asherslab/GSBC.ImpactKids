---
# SeaweedFS' S3 identities, declaratively. This file is the whole reason SeaweedFS was picked over
# Garage: the access keys are a JSON document mounted at startup, so there is no imperative
# "create the key against a live node" post-install hook to get right.
#
# Two identities, not one:
#   impact-kids - the gRPC service. Full access; it is the only writer.
#   backup      - the hourly rclone CronJob. Read and List on the photos bucket and nothing else, so
#                 a compromised or mis-typed backup job cannot delete what it is meant to protect.
#
# Verified 2026-08-29 against chrislusf/seaweedfs:3.98: with this shape the app identity can PUT, the
# backup identity gets 200 on GET and LIST and 403 on PUT and DELETE, and an unsigned request gets 403.
#
# The values are `required` on purpose. An install with a blank credential would stand up an object
# store whose access key is the empty string, which is worse than a failed install.
apiVersion: "v1"
kind: "Secret"
type: "Opaque"
metadata:
  name: "s3-identities-secret"
  labels:
    app.kubernetes.io/name: "impact-kids-app"
    app.kubernetes.io/component: "s3"
    app.kubernetes.io/instance: "{{.Release.Name}}"
stringData:
  s3.json: |
    {
      "identities": [
        {
          "name": "impact-kids",
          "credentials": [
            {
              "accessKey": {{ required "secrets.s3.accessKey is required - see values.yaml" .Values.secrets.s3.accessKey | quote }},
              "secretKey": {{ required "secrets.s3.secretKey is required - see values.yaml" .Values.secrets.s3.secretKey | quote }}
            }
          ],
          "actions": [ "Read", "Write", "List", "Tagging", "Admin" ]
        },
        {
          "name": "backup",
          "credentials": [
            {
              "accessKey": {{ required "secrets.s3.backupAccessKey is required - see values.yaml" .Values.secrets.s3.backupAccessKey | quote }},
              "secretKey": {{ required "secrets.s3.backupSecretKey is required - see values.yaml" .Values.secrets.s3.backupSecretKey | quote }}
            }
          ],
          "actions": [ "Read:{{ .Values.config.s3.bucket }}", "List:{{ .Values.config.s3.bucket }}" ]
        }
      ]
    }
