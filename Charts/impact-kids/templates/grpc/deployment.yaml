---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "grpc-deployment"
  labels:
    app.kubernetes.io/name: "impact-kids-app"
    app.kubernetes.io/component: "grpc"
    app.kubernetes.io/instance: "{{.Release.Name}}"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "impact-kids-app"
        app.kubernetes.io/component: "grpc"
        app.kubernetes.io/instance: "{{.Release.Name}}"
    spec:
      containers:
        - image: "{{ .Values.parameters.grpc.grpc_image }}:{{ .Values.image_tag }}"
          name: "grpc"
          envFrom:
            - configMapRef:
                name: "grpc-config"
            - secretRef:
                name: "grpc-secrets"
            # Photos__AccessKey / Photos__SecretKey for the object store. Created out of band with
            # kubectl like the others; the chart only references it.
            #
            # optional: true on purpose. Without it a missing Secret stops this pod starting at all,
            # which would mean a photo credential that has not been created yet takes sign in down
            # with it. Absent, the service simply registers no photo store: the endpoints are not
            # mapped, they 404, and every avatar falls back to its coloured initial.
            - secretRef:
                name: "photos-secret"
                optional: true
          ports:
            - name: "http"
              protocol: "TCP"
              containerPort: {{ .Values.parameters.grpc.port_http }}
          imagePullPolicy: "IfNotPresent"
  selector:
    matchLabels:
      app.kubernetes.io/name: "impact-kids-app"
      app.kubernetes.io/component: "grpc"
      app.kubernetes.io/instance: "{{.Release.Name}}"
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: "RollingUpdate"
