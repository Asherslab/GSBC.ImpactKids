---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "wasm-deployment"
  labels:
    app.kubernetes.io/name: "impact-kids-app"
    app.kubernetes.io/component: "wasm"
    app.kubernetes.io/instance: "{{.Release.Name}}"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "impact-kids-app"
        app.kubernetes.io/component: "wasm"
        app.kubernetes.io/instance: "{{.Release.Name}}"
    spec:
      containers:
        - image: "{{ .Values.parameters.wasm.wasm_image }}:{{ .Values.image_tag }}"
          name: "wasm"
          ports:
            - name: "http"
              protocol: "TCP"
              containerPort: {{ .Values.parameters.wasm.port_http }}
          imagePullPolicy: "IfNotPresent"
  selector:
    matchLabels:
      app.kubernetes.io/name: "impact-kids-app"
      app.kubernetes.io/component: "wasm"
      app.kubernetes.io/instance: "{{.Release.Name}}"
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: "RollingUpdate"
