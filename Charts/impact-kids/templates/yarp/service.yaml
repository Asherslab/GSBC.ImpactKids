---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "yarp-service"
  labels:
    app.kubernetes.io/name: "impact-kids-app"
    app.kubernetes.io/component: "yarp"
    app.kubernetes.io/instance: "{{.Release.Name}}"
spec:
  type: "ClusterIP"
  selector:
    app.kubernetes.io/name: "impact-kids-app"
    app.kubernetes.io/component: "yarp"
    app.kubernetes.io/instance: "{{.Release.Name}}"
  ports:
    - name: "http"
      protocol: "TCP"
      port: {{ .Values.parameters.yarp.port_http }}
      targetPort: {{ .Values.parameters.yarp.port_http }}
