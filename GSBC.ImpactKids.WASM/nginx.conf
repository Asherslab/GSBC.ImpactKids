user  nginx;
worker_processes  auto;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout  65;
  server_tokens off;

  # Gzip (fallback when client doesn't support Brotli)
  gzip on;
  gzip_comp_level 6;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types
      text/plain text/css application/json application/javascript
      application/x-javascript text/javascript application/xml
      application/xml+rss application/vnd.ms-fontobject
      application/x-font-ttf font/opentype image/svg+xml image/x-icon;

  # Serve precompressed Brotli/Gzip files that dotnet publish produced
  # (Blazor ships .br/.gz for .js/.css/.wasm by default in Release)
  map $http_accept_encoding $enc {
    default "";
    ~*br br;
    ~*gzip gzip;
  }

  # Cache control for static, content-hashed assets (long cache), and index.html (no cache)
  map $uri $cache_header {
    default                                "public, max-age=31536000, immutable";
    ~*^/(index\.html|service-worker\.js)$  "no-cache, no-store, must-revalidate";
  }

  server {
    listen 80;
    server_name _;

    # Root = published wwwroot
    root /usr/share/nginx/html;

    # Prefer Brotli (.br), then gzip (.gz), then original
    # Let nginx pick based on Accept-Encoding via 'try_files'
    location / {
      # SPA fallback: serve index.html for client-side routes
      try_files $uri $uri/ @spa;
      add_header Cache-Control $cache_header always;
    }

    # Static files (css/js/wasm etc.) – serve precompressed when available
    location ~* \.(?:css|js|wasm|json|ico|svg|png|jpg|jpeg|gif|woff2?)$ {
      # try .br then .gz then original
      try_files $uri$enc $uri =404;
      add_header Cache-Control $cache_header always;
    }

    # Health endpoint (created in Dockerfile)
    location = /healthz {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # SPA fallback
    location @spa {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      try_files /index.html =404;
    }
  }
}