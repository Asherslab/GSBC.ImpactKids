name: Docker Build

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  version:
    permissions:
      contents: write
    
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Semantic Version
        id: version
        uses: paulhatch/semantic-version@v5.4.0

      - name: Push Release Tag
        run: |
          git tag v${{ steps.version.outputs.version }}
          git push origin v${{ steps.version.outputs.version }}

  build-migrations:
    runs-on: ubuntu-latest
    needs: version

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Migrations
        uses: docker/build-push-action@v6
        with:
          file: GSBC.ImpactKids.Workers.DbMigrations/Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=asherslab/gsbc-kids-migrations:latest
          cache-to: type=inline
          push: true
          tags: asherslab/gsbc-kids-migrations:latest,asherslab/gsbc-kids-migrations:${{needs.version.outputs.version}}

  build-photo-backfill:
    runs-on: ubuntu-latest
    needs: version

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Photo Backfill
        uses: docker/build-push-action@v6
        with:
          file: GSBC.ImpactKids.Workers.PhotoBackfill/Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=asherslab/gsbc-kids-photo-backfill:latest
          cache-to: type=inline
          push: true
          tags: asherslab/gsbc-kids-photo-backfill:latest,asherslab/gsbc-kids-photo-backfill:${{needs.version.outputs.version}}

  build-grpc:
    runs-on: ubuntu-latest
    needs: version

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Grpc
        uses: docker/build-push-action@v6
        with:
          file: GSBC.ImpactKids.Grpc/Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=asherslab/gsbc-kids-grpc:latest
          cache-to: type=inline
          push: true
          tags: asherslab/gsbc-kids-grpc:latest,asherslab/gsbc-kids-grpc:${{needs.version.outputs.version}}

  build-wasm:
    runs-on: ubuntu-latest
    needs: version

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push WASM
        uses: docker/build-push-action@v6
        with:
          file: GSBC.ImpactKids.WASM/Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=asherslab/gsbc-kids-wasm:latest
          cache-to: type=inline
          push: true
          tags: asherslab/gsbc-kids-wasm:latest,asherslab/gsbc-kids-wasm:${{needs.version.outputs.version}}

  build-yarp:
    runs-on: ubuntu-latest
    needs: version

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push YARP
        uses: docker/build-push-action@v6
        with:
          file: GSBC.ImpactKids.YARP/Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=asherslab/gsbc-kids-yarp:latest
          cache-to: type=inline
          push: true
          tags: asherslab/gsbc-kids-yarp:latest,asherslab/gsbc-kids-yarp:${{needs.version.outputs.version}}
  
  chart:
    needs:
      - version
    permissions:
      contents: write
      packages: write
      statuses: write
    uses: ./.github/workflows/chart-publish.yml
    with:
      version: ${{needs.version.outputs.version}}
  
  # The ProPresenter agent runs on a Mac in the room, not in the cluster, so it ships as a zip on the
  # release rather than an image. It rides in the release the chart job just created, which
  # chart-releaser marks Latest - that is what lets the admin page link to
  # releases/latest/download/... and always get the agent built from the same commit as the app.
  # Never publish a separate agent release: it would take Latest away from the app's.
  build-propresenter-agent:
    runs-on: macos-latest
    needs:
      - version
      - chart
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Both architectures from one Mac runner; publishing on macOS ad-hoc signs the binaries, and
      # install.sh signs them again on the target Mac anyway.
      - name: Publish for Intel and Apple Silicon
        run: |
          for rid in osx-x64 osx-arm64; do
            dotnet publish GSBC.ImpactKids.ProPresenterAgent/GSBC.ImpactKids.ProPresenterAgent.csproj \
              -c Release -r "$rid" -p:Version=${{ needs.version.outputs.version }} -o "out/agent/$rid"
          done
          cp GSBC.ImpactKids.ProPresenterAgent/install/*.sh out/agent/
          chmod +x out/agent/*.sh out/agent/*/impactkids-propresenter-agent
          (cd out/agent && zip -qr ../impactkids-propresenter-agent-macos.zip .)

      - name: Attach to the app release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "impact-kids-app-${{ needs.version.outputs.version }}" \
            out/impactkids-propresenter-agent-macos.zip --clobber

  argo-update:
    secrets: inherit
    needs:
      - version
      - build-migrations
      - build-photo-backfill
      - build-grpc
      - build-wasm
      - build-yarp
    uses: ./.github/workflows/argo-repo-update.yml
    with:
      version: ${{needs.version.outputs.version}}
